<!DOCTYPE html>
<html lang="en" id="mode" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="icon" href="./icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:opsz,wght@10..72,100..900&family=Bungee&family=Monoton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body class="font-serif ease-in-out select-none text-black dark:transition dark:ease-in-out dark:text-white dark:bg-gray-900 ">
    <!-- background -->
    <div class="z-0 h-screen w-screen fixed top-0 left-0">
      <div class="bgShapeClass bg-cyan-300 dark:bg-blue-700 bottom-0 left-0 animate-[spin_20s_linear_infinite]">
        <div class="bgInnerShapeClass dark:bg-gray-900 bottom-[40%] left-0 animate-[spin_15s_linear_infinite]"></div>
      </div>
      <div class="bgShapeClass bg-pink-300 dark:bg-indigo-700 top-0 right-0 animate-[spin_20s_linear_infinite]">
        <div class="bgInnerShapeClass dark:bg-gray-900 top-[40%] right-0 animate-[spin_15s_linear_infinite]"></div>
      </div>
    </div>
    <!-- main -->
    <div id="redflash" class="z-10 relative h-screen min-h-154 w-full flex flex-col justify-center items-center">
      <div class="flex justify-center items-center h-25 w-full">
        <h1 class="text-center font-[Monoton] whitespace-pre h-full pt-9 max-sm:text-3xl max-md:text-4xl max-lg:text-5xl lg:text-5xl">SIMON    SAYS    GAME</h1>
      </div>
      <!-- Game Area -->
      <div class="flex flex-col justify-center items-center h-full">
        <pre id="info" class="text-center font-bold mb-4 mt-6 font-BigShouldersStencil max-sm:text-2xl max-md:text-3xl max-lg:text-4xl lg:text-4xl">Press anywhere to start the game</pre>
        <div class="min-h-80 w-80 p-2 grid grid-cols-2 grid-rows-2 gap-2 border-2 rounded-3xl border-gray-400 bg-white *:border-2 *:rounded-2xl *:border-gray-400 *:duration-200">
          <div id="red" class="red btn"></div>
          <div id="blue" class="blue btn"></div>
          <div id="yellow" class="yellow btn"></div>
          <div id="green" class="green btn"></div>
        </div>
        <p id="maxScore" class="text-center mt-8 sm:mb-8 max-sm:mb-14 font-[Bungee] max-sm:text-2xl max-md:text-3xl max-lg:text-4xl lg:text-4xl">--- Highest Score ---</p>
      </div>
    </div>
    <!-- dark mode Switch -->
    <div class="z-10 fixed size-10 sm:right-9 sm:top-9 max-sm:bottom-4 max-sm:right-4 ">
      <input id="check" class="size-full hidden" type="checkbox" checked="checked">
      <!-- sun icon -->
      <label for="check" id="sun" class="size-full absolute visible dark:invisible">
        <svg
          class="size-full fill-current"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24">
          <path
            d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
        </svg>
      </label>
      <!-- moon icon -->
      <label for="check" id="moon" class="size-full absolute invisible dark:visible">
        <svg
          class="size-full fill-current"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24">
          <path
            d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
        </svg>
      </label>
    </div>
    
    <!-- Js file -->
    <script src="./app.js"></script>
  </body>
</html>
